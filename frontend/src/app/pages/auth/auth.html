<form class="auth-form">
    <div class="icon">
        <i class="bi bi-book-half"></i>
    </div>
    <h1>Base de conhecimento</h1>
    <mat-form-field appearance="outline" class="form-input">
        <mat-label>Nome de usuário</mat-label>
        <input matInput [formControl]="username" (blur)="updateErrorMessage()" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-input">
        <mat-label>Senha</mat-label>
        <input matInput [formControl]="password" [type]="hide() ? 'password' : 'text'" (blur)="updateErrorMessage()"
            required>
        <button class="hide-btn" matIconButton matSuffix (click)="toggleHidePassword($event)"
            [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide()">
            <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
    </mat-form-field>
    @if (errorMessage()) {
    <mat-error>{{errorMessage()}}</mat-error>
    }
    <button (click)="login()" class="send-btn" matButton="elevated">Entrar</button>
</form>
