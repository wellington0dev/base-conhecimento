<main class="main">
    <mat-toolbar class="toolbar">
        <button type="button" matIconButton class="search-icon" aria-label="Buscar">
            <i class="bi bi-search"></i>
        </button>
        <input type="text" class="search-input" placeholder="Buscar por nome ou username" [value]="searchTerm()"
            (input)="onSearch($any($event.target).value)" />

        <span class="toolbar-spacer"></span>

        <button matButton="filled" (click)="openCreateDialog()">
            <i class="bi bi-plus-lg"></i> Adicionar usuário
        </button>
    </mat-toolbar>
    <div class="user-list">
        @if(filteredUsers().length > 0){
        @for(user of filteredUsers(); track user.id){
        <mat-card class="user-card" appearance="outlined">
            <mat-card-header>
                <div mat-card-avatar class="example-header-image"></div>
                <mat-card-title>{{ user.name }}</mat-card-title>
                <mat-card-subtitle>{{user.username}}</mat-card-subtitle>
            </mat-card-header>
            <i class="bi bi-person-vcard icon"></i>
            <mat-card-content>
                <p>{{user.role}}</p>
                @if (!user.active) {
                <span class="badge-inactive">Inativo</span>
                }
            </mat-card-content>
            <mat-card-actions>
                <button matButton (click)="openEditDialog(user)">Editar</button>
                <button
                    matButton
                    (click)="openDeactivateDialog(user)"
                    [disabled]="!user.active || isSelf(user)"
                    [attr.title]="isSelf(user) ? 'Você não pode desativar a própria conta' : null"
                >
                    {{ isSelf(user) ? 'Você' : (user.active ? 'Desativar' : 'Desativado') }}
                </button>
            </mat-card-actions>
        </mat-card>
        }
        } @else {
        <p class="empty-state">Nenhum usuário encontrado.</p>
        }
    </div>
</main>
