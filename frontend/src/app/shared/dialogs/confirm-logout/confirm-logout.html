<h2 mat-dialog-title>Sair da conta</h2>
<mat-dialog-content>
  <p>Tem certeza que deseja sair? Você vai precisar fazer login novamente para continuar.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton (click)="close()">Cancelar</button>
  <button matButton="filled" class="confirm" (click)="confirm()" cdkFocusInitial>Sair</button>
</mat-dialog-actions>
