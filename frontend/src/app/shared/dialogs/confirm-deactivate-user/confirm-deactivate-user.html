<h2 mat-dialog-title>Desativar usuário</h2>
<mat-dialog-content>
  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }
  <p>
    Tem certeza que deseja desativar <strong>{{ user.name }}</strong>?
    O usuário não vai mais conseguir fazer login até ser reativado.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton (click)="close()">Cancelar</button>
  <button matButton="filled" class="confirm" (click)="confirm()" [disabled]="saving()" cdkFocusInitial>
    Desativar
  </button>
</mat-dialog-actions>
